<div class="container">
  <h2>Véhicules exportés</h2>

  <div class="grid">
    @for (vehicule of vehicules(); track vehicule.id) {
      <div class="vehicle-card">
        <div class="card-header">
          <span class="badge badge-export">Exporté</span>
        </div>
        <div class="card-image">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="120" height="120" class="car-icon">
            <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path>
            <circle cx="7" cy="17" r="2"></circle>
            <path d="M9 17h6"></path>
            <circle cx="17" cy="17" r="2"></circle>
          </svg>
        </div>
        <div class="card-content">
          <h3>{{ vehicule.marque }} {{ vehicule.modele }}</h3>
          <p class="price">{{ vehicule.prix.toLocaleString('fr-FR') }} FCFA</p>
          <div class="specs">
            <span class="spec">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="5" cy="5" r="2"></circle>
                <circle cx="12" cy="5" r="2"></circle>
                <circle cx="19" cy="5" r="2"></circle>
                <circle cx="5" cy="12" r="2"></circle>
                <circle cx="12" cy="12" r="2"></circle>
                <circle cx="19" cy="12" r="2"></circle>
                <circle cx="5" cy="19" r="2"></circle>
                <circle cx="12" cy="19" r="2"></circle>
                <circle cx="19" cy="19" r="2"></circle>
                <line x1="5" y1="7" x2="5" y2="10"></line>
                <line x1="12" y1="7" x2="12" y2="10"></line>
                <line x1="19" y1="7" x2="19" y2="10"></line>
                <line x1="5" y1="14" x2="5" y2="17"></line>
                <line x1="12" y1="14" x2="12" y2="17"></line>
                <line x1="19" y1="14" x2="19" y2="17"></line>
              </svg>
              {{ vehicule.transmission }}
            </span>
            <span class="spec">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="22" x2="15" y2="22"></line>
                <line x1="4" y1="9" x2="14" y2="9"></line>
                <path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"></path>
                <path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2 2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5"></path>
                <path d="M14 9h-8"></path>
              </svg>
              {{ vehicule.carburant }}
            </span>
          </div>
          <div class="warranty">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            Garantie {{ vehicule.garantie }} mois
          </div>
        </div>
      </div>
    }
  </div>
</div>
