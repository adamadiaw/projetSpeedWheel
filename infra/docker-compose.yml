services:
  postgres:
    image: postgres:16
    container_name: speedwheel_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: speedwheel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - speedwheel_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: speedwheel_redis
    ports:
      - "6379:6379"
    networks:
      - speedwheel_network

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speedwheel_jenkins
    privileged: true
    ports:
      - "8088:8080"
      - "50000:50000"
    volumes:
      - jenkins_home_vol:/var/jenkins_home
      - /run/user/1000/podman/podman.sock:/run/podman/podman.sock
    user: root
    networks:
      - speedwheel_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: speedwheel_backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/speedwheel
      - DB_USERNAME=admin
      - DB_PASSWORD=admin123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - speedwheel_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: speedwheel_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - speedwheel_network

volumes:
  postgres_data:
  jenkins_home_vol:

networks:
  speedwheel_network:
    driver: bridge