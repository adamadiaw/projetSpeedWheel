services:
  postgres:
    image: postgres:16
    container_name: speedwheel_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: speedwheel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - speedwheel_network

  redis:
    image: redis:7-alpine
    container_name: speedwheel_redis
    ports:
      - "6379:6379"
    networks:
      - speedwheel_network

volumes:
  postgres_data:

networks:
  speedwheel_network:
    driver: bridge